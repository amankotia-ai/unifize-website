name: Sync website content from Notion

on:
  workflow_dispatch:
  schedule:
    # Hourly. Every push to main auto-deploys via Vercel, so a Notion edit
    # reaches the live site within the hour, or immediately via Run workflow.
    # If a sync ever breaks the build, Vercel keeps serving the last good
    # deployment; nothing goes dark.
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull page copy from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/notion/sync-copy.mjs
      - name: Mirror structured sources (Products, Personas, ...)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/notion/sync-sources.mjs
      - name: Commit and push if changed
        # Runs even when a sync step failed: an approved copy edit must not be
        # held hostage by a broken sources pull. The run still shows red so the
        # failure stays visible until the cause is fixed.
        if: ${{ !cancelled() }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "notion-sync"
            git config user.email "notion-sync@users.noreply.github.com"
            git add "src/app/explorations/**/*-copy.json" src/content/notion
            git commit -m "content: sync from Notion"
            git push
          else
            echo "No content changes."
          fi
