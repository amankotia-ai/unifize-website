name: Sync website content from Notion

on:
  workflow_dispatch:
  # Fired by the Vercel endpoint /api/notion-sync when a Notion webhook
  # reports an edit, so an approved change lands within a couple of minutes.
  repository_dispatch:
    types: [notion-content-edit]
  schedule:
    # Every 10 minutes as the fallback cadence (repo is public, Actions
    # minutes are free). Every push to main auto-deploys via Vercel. If a
    # sync ever breaks the build, Vercel keeps serving the last good
    # deployment; nothing goes dark.
    - cron: "*/10 * * * *"

permissions:
  contents: write

# One sync at a time: overlapping runs would race each other's git push and
# the Notion write-back. A run that arrives while one is active waits; if
# several queue up, GitHub keeps only the newest pending one.
concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull page copy from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/notion/sync-copy.mjs
      - name: Mirror structured sources (Products, Personas, ...)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/notion/sync-sources.mjs
      - name: Commit and push if changed
        # Runs even when a sync step failed: an approved copy edit must not be
        # held hostage by a broken sources pull. The run still shows red so the
        # failure stays visible until the cause is fixed.
        if: ${{ !cancelled() }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "notion-sync"
            git config user.email "notion-sync@users.noreply.github.com"
            git add "src/app/explorations/**/*-copy.json" src/content/notion
            git commit -m "content: sync from Notion"
            git push
          else
            echo "No content changes."
          fi
      - name: Write back to Notion (Live Text, Last Synced, Renders)
        # After the shipped state is on main, report it back into the Copy
        # Fields DB so every row shows what is actually live. Delta-only:
        # rows already up to date are not touched. Runs even if a sync step
        # failed, so the columns never go stale silently; its own failure
        # marks the run red without holding the push hostage (it runs last).
        if: ${{ !cancelled() }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/notion/writeback-copy.mjs
