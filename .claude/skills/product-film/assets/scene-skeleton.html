<!doctype html>
<!--
  scene-skeleton.html - the starting point for a new product film scene.

  Copy it to scripts/product-films/<slug>/film.html together with
  ui-kit.css and motion-kit.js (same folder), then replace the example step
  with the film's real steps. It already has everything the pipeline
  expects: a 1360 x 660 window in #cam, window.seek(T), window.camAt(T),
  ?mode=board (camera + preview look) and ?mode=flat (window only, for
  textures), ?play to preview in real time.

  The example step shows the patterns: pointer arcs in, hover, click, a
  field takes focus, typing at a human rhythm, a button goes Save -> Saving
  -> Saved, a count ticks, and the step ends at rest.

  Everything is a pure function of time. Each step has: S<n> (length),
  CAM<n> (camera keys), render<n>(t) (step-local t), reset<n>() (puts every
  element the step touches back the way it was before the step).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product film scene</title>
<!-- the Unifize app UI as the films draw it: reuse, never restyle -->
<link rel="stylesheet" href="ui-kit.css">
<style>
/* fonts: the repo's own files (adjust the ../ depth to where this file lives) */
@font-face { font-family: "Inter"; src: url("../../../src/app/fonts/inter-variable.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Plex"; src: url("../../../src/app/fonts/ibm-plex-sans-variable.woff2") format("woff2"); font-weight: 100 700; }
@font-face { font-family: "JBM"; src: url("../../../src/app/fonts/jetbrains-mono-variable.woff2") format("woff2"); font-weight: 100 800; }

/* ---------------------------------------------------------------- example step (replace) */
.ex-h .crumb { color: var(--muted); font-size: 11px; }
.ex-h h1 { margin: 6px 0 18px; font: 600 25px/1.15 var(--disp); letter-spacing: -0.012em; }
.ex-card { width: 560px; padding: 16px 18px; border-radius: 7px; background: #fff; box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px rgb(16 24 40 / 0.04); }
.ex-card label { display: block; margin-bottom: 6px; color: var(--muted); font: 600 9.5px/1 var(--mono); letter-spacing: 0.1em; }
.ex-fld { display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line2); font-size: 13px; }
.ex-fld .ph { color: var(--faint); }
.ex-fld .caret { display: inline-block; width: 1.5px; height: 15px; margin-left: 1px; margin-right: -2.5px; background: var(--blue); opacity: 0; }
.ex-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.ex-count { color: var(--muted); font: 500 11px/1 var(--mono); }
.ex-row .btn { margin-left: auto; }

</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div class="win">
      <nav class="nav">
        <div class="logo">U</div>
        <div class="it on"><svg class="ic" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg></div>
        <div class="it"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div class="it"><svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M8 17v-6"/><path d="M13 17V7"/><path d="M18 17v-4"/></svg></div>
        <div class="it"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
        <div class="foot"><div class="me">DF</div></div>
      </nav>
      <main class="body">
        <!-- ============ example step: replace with the film's screens -->
        <div class="ex-h"><div class="crumb">Change controls</div><h1>CC-2148 · Torque spec update</h1></div>
        <section class="ex-card">
          <label>IMPACT ASSESSMENT</label>
          <div class="ex-fld" id="ex-fld"><span id="ex-typed"></span><i class="caret" id="ex-caret"></i><span class="ph" id="ex-ph">Add the impact assessment</span></div>
          <div class="ex-row"><span class="ex-count" id="ex-count">2 of 9 done</span><span class="btn pri" id="ex-save">Save</span></div>
        </section>
      </main>
    </div>
    <svg id="cursor" viewBox="0 0 22 30"><path d="M2 2 L2 23.5 L7.4 18.3 L11.1 27 L14.7 25.5 L11 16.9 L18.6 16.9 Z" fill="#101114" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
  <div id="grain"></div>
</div>

<!-- the films' motion: easing, camera, pointer, typing, arrivals, ticks -->
<script src="motion-kit.js"></script>
<script>
/* ================================================================== scene setup */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const MODE = new URLSearchParams(location.search).get("mode") || "board";
document.documentElement.classList.add(MODE);
const cam = $("#cam"), cursor = $("#cursor");

/* ================================================================== step 1 (example: replace)
 * Claim: the record is filled in where the work happens. */
const S1 = 4.2;
const CAM1 = [
  { t: 0.0, cx: 520, cy: 300, vw: 1500 },
  { t: 1.0, cx: 420, cy: 220, vw: 1000 },   /* in on the field, then still while she types */
  { t: 3.0, cx: 440, cy: 225, vw: 960 },
  { t: 4.2, cx: 520, cy: 260, vw: 1200 },   /* ends at rest: the hand-off frame */
];
const fld = $("#ex-fld"), typed = $("#ex-typed"), caret = $("#ex-caret"), ph = $("#ex-ph"), save = $("#ex-save"), count = $("#ex-count");
const TEXT = "Torque spec only. No form or fit change; risk low.";
const T_TYPE = rhythm(TEXT, 11, 0.013, 0.012);
const CLICK_FLD = 0.75, TYPE_AT = 0.95, CLICK_SAVE = 2.75;
const SAVE_HTML = { idle: "Save", busy: '<i class="spin"></i>Saving', done: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Saved' };

function reset1() {
  for (const el of [fld, typed, caret, ph, save, count]) el.removeAttribute("style");
  typed.textContent = ""; count.textContent = "2 of 9 done";
  if (save.dataset.s !== "idle") { save.innerHTML = SAVE_HTML.idle; save.dataset.s = "idle"; }
}

function render1(t) {
  /* focus and type */
  const focus = E.outCubic(seg(t, CLICK_FLD + 0.03, CLICK_FLD + 0.16));
  fld.style.boxShadow = focusRing(focus);
  const n = typedCount(T_TYPE, t, TYPE_AT);
  typed.textContent = TEXT.slice(0, n);
  ph.style.display = n > 0 ? "none" : "";
  caret.style.opacity = focus > 0.5 && t < CLICK_SAVE && caretOn(t, CLICK_FLD, n < TEXT.length) ? 1 : 0;

  /* save: idle -> busy -> done, and the proof lands */
  const st = buttonState(t, CLICK_SAVE, 0.39);
  if (save.dataset.s !== st) { save.innerHTML = SAVE_HTML[st]; save.dataset.s = st; }
  if (st === "busy") save.querySelector(".spin").style.transform = `rotate(${(t - CLICK_SAVE) * 900}deg)`;
  const pS = pressAt(t, CLICK_SAVE);
  save.style.background = st === "done" ? "#1f8a52" : pS > 0 ? "var(--blue-d)" : "";
  save.style.transform = `scale(${1 - 0.04 * pS})`;
  count.textContent = t >= CLICK_SAVE + 0.5 ? "3 of 9 done" : "2 of 9 done";

  /* pointer: in on an arc, click the field, hide while typing, to Save */
  const f = at(fld), b = at(save);
  const pIn = { x: 900, y: 560 }, pFld = { x: f.x + 180, y: f.y + 22 }, pSave = { x: b.x + b.w / 2, y: b.y + b.h / 2 + 2 };
  const p = t < 2.2 ? move(t, pIn, pFld, 0.1, 0.7, 60) : move(t, pFld, pSave, 2.25, 2.7, 30);
  const hide = typingHide(t, TYPE_AT, 2.25);
  setPointer(cursor, p, seg(t, 0.1, 0.25) * (1 - hide), pressAny(t, [CLICK_FLD, CLICK_SAVE]));
}

/* ================================================================== dispatcher
 * Add steps like this: S2, CAM2, render2, reset2, then
 *   if (T < S1) { reset2(); reset1(); render1(T); }
 *   else { render1(S1); render2(T - S1); }
 * Earlier steps must render identically after a later step is added. */
const cam1 = camera(CAM1);
const STEPS = [0, S1];
const DUR = S1;
const camAt = T => cam1(T);

function render(T) {
  T = clamp(T, 0, DUR);
  reset1(); render1(T);
  const c = camAt(T);
  if (MODE === "board") {
    const W = innerWidth, H = innerHeight, s = W / c.vw;
    cam.style.transform = `translate(${W / 2 - c.cx * s}px, ${H / 2 - c.cy * s}px) scale(${s})`;
    const g = Math.floor(T * 12) % 8, j = [[0, 0], [-37, 21], [53, -44], [-18, 67], [29, 11], [-61, -23], [14, -58], [44, 38]][g];
    $("#grain").style.transform = `translate(${j[0]}px, ${j[1]}px)`;
  }
  window.__t = T;
}
window.seek = t => render(t);
window.camAt = camAt;
window.STEPS = STEPS;
const t0 = +(new URLSearchParams(location.search).get("t") || 0);
document.fonts.ready.then(() => render(t0));
render(t0);
if (new URLSearchParams(location.search).has("play")) {
  const from = +(new URLSearchParams(location.search).get("play") || 0), start = performance.now();
  const tick = now => { render((from + (now - start) / 1000) % DUR); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
