<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Checklist header</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/chat-fragments/styles.css" />
<style>
  body { padding: 0; background: var(--n-50); }
  .check { width: 100%; border-left: 0; }
</style>
</head>
<body>
<aside class="check">
  <div class="check-head">
    <div class="eyebrow">
      <span>CAR-41 · Checklist</span>
      <span style="margin-left: auto; font-family: var(--u-mono); color: var(--text-faint);">v4.2</span>
    </div>
    <h3>Corrective action request</h3>
  </div>
  <div class="check-progress">
    <div class="row"><span>Completion</span><span class="frac">5/8 sections</span></div>
    <div class="prog-bar"><div class="fill" style="width: 62.5%;"></div></div>
  </div>
</aside>
</body>
</html>
