<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Composer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/chat-fragments/styles.css" />
<style>
  body { padding: 0; background: var(--n-50); }
  .composer { background: var(--n-0); border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="composer">
  <div class="composer-box">
    <div class="composer-input" contenteditable="true" data-placeholder="Reply to NC-25…"></div>
    <div class="composer-tools">
      <button class="tool" title="Attach"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M12 7l-5 5a3 3 0 01-4-4l6-6a2 2 0 013 3l-6 6a1 1 0 01-1-1l5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="tool" title="Mention"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 8v1a1.8 1.8 0 003.5 0V8a6 6 0 10-2.5 4.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button class="tool" title="Link record"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 10l4-4M7 5l1.5-1.5a2 2 0 013 3L11 8M9 11l-1.5 1.5a2 2 0 01-3-3L6 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button class="tool" title="AI"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2l1.5 4L13 7.5 9.5 9 8 13 6.5 9 3 7.5 6.5 6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm">Save draft</button>
      <button class="btn btn-primary btn-sm">Send <span class="kbd">↩</span></button>
    </div>
  </div>
</div>
</body>
</html>
