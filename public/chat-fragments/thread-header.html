<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thread header</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/chat-fragments/styles.css" />
<style>
  body { padding: 0; background: var(--n-50); }
  .thread { width: 100%; background: var(--n-0); }
</style>
</head>
<body>
<section class="thread">
  <div class="thread-head">
    <div class="id-row">
      <span class="badge badge-info"><span class="pulse"></span>IDENTIFIED</span>
      <span class="nc">NC-25</span>
      <span class="nc">·</span>
      <span class="nc">Opened Apr 18</span>
    </div>
    <h2>Assembly defect detected in final inspection</h2>
    <div class="thread-meta">
      <div class="meta-chip"><span class="k">Owner</span><span class="v"><span class="avatar">LM</span>Lisa Martin</span></div>
      <div class="meta-chip"><span class="k">Participants</span><span class="v">
        <span class="avatar" style="margin-right: -4px;">DS</span>
        <span class="avatar" style="margin-right: -4px;">RK</span>
        <span class="avatar" style="margin-right: -4px;">HS</span>
        <span class="avatar">+2</span>
      </span></div>
      <div class="meta-chip"><span class="k">Due</span><span class="v">Apr 24</span></div>
      <div class="meta-chip"><span class="k">Priority</span><span class="v">Normal</span></div>
      <div class="meta-chip"><span class="k">Linked</span><span class="v">CAR-41 · RCA-12</span></div>
      <div style="margin-left: auto; display: flex; gap: 6px;">
        <button class="btn btn-ghost btn-sm"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> Add field</button>
        <button class="btn btn-ghost btn-sm"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="3" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="13" cy="8" r="1.3" fill="currentColor"/></svg></button>
      </div>
    </div>
  </div>
</section>
</body>
</html>
