<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat message</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/chat-fragments/styles.css" />
<style>
  body { padding: 24px; background: var(--n-0); display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
  <div class="msg">
    <div class="msg-av">LM</div>
    <div class="msg-body">
      <div class="msg-name-row">
        <span class="msg-name">Lisa Martin</span>
        <span class="msg-time">09:02</span>
      </div>
      <div class="msg-text">We've found an assembly defect during the final inspection. Let's investigate and find out what went wrong.</div>
    </div>
  </div>
  <div class="msg">
    <div class="msg-av">DS</div>
    <div class="msg-body">
      <div class="msg-name-row">
        <span class="msg-name">Daniel Storm</span>
        <span class="msg-time">10:38</span>
      </div>
      <div class="msg-text">Thanks — I'll create corrective actions for each cause. @Lisa @Rupa please review.</div>
    </div>
  </div>
</body>
</html>
