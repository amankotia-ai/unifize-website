<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nav rail</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/chat-fragments/styles.css" />
<style>
  body { padding: 0; background: var(--n-50); display: flex; }
  .nav { height: 100vh; }
</style>
</head>
<body>
<aside class="nav">
  <div class="nav-logo">U</div>
  <div class="nav-item" title="Home"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 8L9 3.5 15 8v6.5a.5.5 0 01-.5.5h-11a.5.5 0 01-.5-.5V8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
  <div class="nav-item active" title="Conversations"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5a1 1 0 011-1h10a1 1 0 011 1v7a1 1 0 01-1 1H7l-4 3V5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
  <div class="nav-item" title="Documents"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M5 2.5h5.5L14 6v8.5a1 1 0 01-1 1H5a1 1 0 01-1-1v-11a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 2.5V6h4" stroke="currentColor" stroke-width="1.4"/></svg></div>
  <div class="nav-item" title="Dashboard"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="3" width="5.5" height="5.5" stroke="currentColor" stroke-width="1.4"/><rect x="9.5" y="3" width="5.5" height="5.5" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="9.5" width="5.5" height="5.5" stroke="currentColor" stroke-width="1.4"/><rect x="9.5" y="9.5" width="5.5" height="5.5" stroke="currentColor" stroke-width="1.4"/></svg></div>
  <div class="nav-item" title="People"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="7" r="2.8" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 15c1.2-2.8 3.4-3.9 5.5-3.9s4.3 1.1 5.5 3.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
  <div class="nav-spacer"></div>
  <div class="nav-item" title="Settings"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M9 3.5V2m0 14v-1.5m5.5-5.5H16M2 9h1.5M12.9 5.1L14 4M4 14l1.1-1.1M12.9 12.9L14 14M4 4l1.1 1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
  <div class="nav-avatar"></div>
</aside>
</body>
</html>
