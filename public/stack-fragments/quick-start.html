<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quick start</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/stack-fragments/styles.css" />
<style>
  body {
    padding: 28px 24px;
    background: var(--n-25);
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .qs-wrap {
    width: 100%;
    max-width: 560px;
  }
  .qs-h {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 14px;
    letter-spacing: -0.005em;
  }
  .qs-panel {
    background: var(--n-0);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
  }
  .qs-panel-h {
    font-size: 13px;
    font-weight: 600;
    color: var(--u-primary);
    margin: 0 0 14px;
  }
  .qs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .qs-btn {
    padding: 13px 16px;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    background: var(--n-0);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
    letter-spacing: -0.003em;
  }
  .qs-btn.active {
    background: var(--n-700);
    color: white;
    border-color: var(--n-700);
    position: relative;
  }
  .qs-btn.active::before {
    content: '';
    position: absolute;
    inset: -6px;
    border: 2px dashed var(--s-err);
    border-radius: 8px;
    pointer-events: none;
  }
  .qs-caption {
    margin-top: 16px;
    font-family: var(--u-mono);
    font-size: 10.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="qs-wrap">
    <h2 class="qs-h">Quick Start</h2>
    <div class="qs-panel">
      <h3 class="qs-panel-h">Start New</h3>
      <div class="qs-grid">
        <button class="qs-btn">Document</button>
        <button class="qs-btn active">Non-Conformance</button>
        <button class="qs-btn">Change Control</button>
        <button class="qs-btn">CAR</button>
      </div>
    </div>
    <div class="qs-caption">home screen · one click to a new NC</div>
  </div>
</body>
</html>
