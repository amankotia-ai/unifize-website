<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Color tokens</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/stack-fragments/styles.css" />
</head>
<body>
<div class="label">Brand</div>
<div class="brand-grid">
  <div class="swatch"><div class="swatch-color" style="background:var(--u-primary)"></div><div class="swatch-meta"><div class="swatch-name">Primary</div><div class="swatch-hex">#0052FF</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:var(--u-primary-hover)"></div><div class="swatch-meta"><div class="swatch-name">Primary · Hover</div><div class="swatch-hex">#003ECC</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:var(--u-primary-tint)"></div><div class="swatch-meta"><div class="swatch-name">Primary · Tint</div><div class="swatch-hex">#F0F4FF</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:var(--u-primary-border)"></div><div class="swatch-meta"><div class="swatch-name">Primary · Border</div><div class="swatch-hex">#D6E0FF</div></div></div>
</div>

<div class="label" style="margin-top:8px;">Neutral ramp · 13 steps</div>
<div class="ramp" style="margin-bottom:18px;">
  <div class="step" style="background:var(--n-0)">0</div>
  <div class="step" style="background:var(--n-25)">25</div>
  <div class="step" style="background:var(--n-50)">50</div>
  <div class="step" style="background:var(--n-100)">100</div>
  <div class="step" style="background:var(--n-150)">150</div>
  <div class="step" style="background:var(--n-200)">200</div>
  <div class="step" style="background:var(--n-300)">300</div>
  <div class="step dark" style="background:var(--n-400)">400</div>
  <div class="step dark" style="background:var(--n-500)">500</div>
  <div class="step dark" style="background:var(--n-600)">600</div>
  <div class="step dark" style="background:var(--n-700)">700</div>
  <div class="step dark" style="background:var(--n-800)">800</div>
  <div class="step dark" style="background:var(--n-900)">900</div>
</div>

<div class="label">Status</div>
<div class="status-grid">
  <div class="status-cell"><div class="ch" style="background:var(--s-ok)"></div><div class="nm">Ok</div><div class="hx">#0B8A5C · tint #E8F5EF</div></div>
  <div class="status-cell"><div class="ch" style="background:var(--s-warn)"></div><div class="nm">Warn</div><div class="hx">#B4731A · tint #FBF2E2</div></div>
  <div class="status-cell"><div class="ch" style="background:var(--s-err)"></div><div class="nm">Err</div><div class="hx">#C4303A · tint #FBEBEC</div></div>
</div>
</body>
</html>
