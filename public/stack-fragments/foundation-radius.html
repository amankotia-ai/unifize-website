<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radius scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/stack-fragments/styles.css" />
</head>
<body>
<div class="radius-grid">
  <div class="radius-card" style="border-radius:2px"><span>--r-1</span><span>2</span></div>
  <div class="radius-card" style="border-radius:3px"><span>--r-2</span><span>3</span></div>
  <div class="radius-card" style="border-radius:5px"><span>--r-3</span><span>5</span></div>
  <div class="radius-card" style="border-radius:8px"><span>--r-4</span><span>8</span></div>
</div>
</body>
</html>
