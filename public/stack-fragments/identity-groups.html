<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Groups</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/stack-fragments/styles.css" />
<style>
  body { padding: 0; background: var(--n-25); }
  .wrap { background: var(--n-0); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
</style>
</head>
<body>
<div class="wrap">
<table class="tbl">
  <thead>
    <tr>
      <th style="width: 280px;">Group name</th>
      <th>Participants</th>
      <th>Group owner</th>
      <th>Created by</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><span class="group-name">Document Signatories</span></td>
      <td>
        <div class="avstack">
          <span class="av av-1">EP</span>
          <span class="av av-2">DC</span>
          <span class="av av-3">BM</span>
          <span class="av av-4">JC</span>
          <span class="more">+8</span>
        </div>
      </td>
      <td><div class="person"><span class="av av-1">EP</span>Ethan Parker</div></td>
      <td><div class="person"><span class="av av-4">JC</span>Jack Coyne</div></td>
    </tr>
    <tr>
      <td>
        <span class="group-name">
          Quality
          <svg class="lock" width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M5 7V5a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.4"/></svg>
        </span>
      </td>
      <td>
        <div class="avstack">
          <span class="av av-6">LM</span>
          <span class="av av-2">DC</span>
          <span class="av av-3">BM</span>
          <span class="av av-4">JC</span>
          <span class="more">+3</span>
        </div>
      </td>
      <td><div class="person"><span class="av av-6">LM</span>Lucas Mitchell</div></td>
      <td><div class="person"><span class="av av-2">DC</span>Dennis Carter</div></td>
    </tr>
    <tr>
      <td><span class="group-name">Maintenance Technicians</span></td>
      <td>
        <div class="avstack">
          <span class="av av-7">OJ</span>
          <span class="av av-3">BM</span>
          <span class="av av-2">JD</span>
        </div>
      </td>
      <td><div class="person"><span class="av av-7">OJ</span>Oliver Jameson</div></td>
      <td><div class="person"><span class="av av-5">JD</span>Jessica Davis</div></td>
    </tr>
    <tr>
      <td>
        <span class="group-name">
          Internal Auditors
          <svg class="lock" width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M5 7V5a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.4"/></svg>
        </span>
      </td>
      <td>
        <div class="avstack">
          <span class="av av-5">AM</span>
          <span class="av av-8">EM</span>
        </div>
      </td>
      <td><div class="person"><span class="av av-5">AM</span>Ava Martinez</div></td>
      <td><div class="person"><span class="av av-8">EM</span>Emily Martinez</div></td>
    </tr>
  </tbody>
</table>
</div>
</body>
</html>
