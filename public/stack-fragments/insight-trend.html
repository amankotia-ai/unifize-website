<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NCs opened vs closed</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/stack-fragments/styles.css" />
<style>body { padding: 24px; background: var(--n-25); }</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <h3 class="title">NCs opened vs closed</h3>
    <div class="legend">
      <span class="sw"><span class="dot" style="background: var(--n-400);"></span>Opened</span>
      <span class="sw"><span class="dot" style="background: var(--u-primary);"></span>Closed</span>
    </div>
  </div>
  <div class="card-body">
    <div id="chart" style="height: 220px;"></div>
  </div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const W = 540, H = 220, PAD_L = 28, PAD_R = 10, PAD_T = 14, PAD_B = 28;
const plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;
const labels = ['W-4', 'W-3', 'W-2', 'W-1', 'This'];
const opened = [7, 9, 6, 8, 5];
const closed = [4, 6, 7, 9, 11];
const max = 12;

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const s = el('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: '100%', preserveAspectRatio: 'none' });

[0, 3, 6, 9, 12].forEach(t => {
  const y = PAD_T + plotH * (1 - t/max);
  s.appendChild(el('line', { x1: PAD_L, x2: W - PAD_R, y1: y, y2: y, stroke: '#EEF0F2', 'stroke-width': 1 }));
  const lbl = el('text', { x: PAD_L - 6, y: y + 3, 'text-anchor': 'end', fill: '#8B93A0', 'font-family': 'JetBrains Mono', 'font-size': 10 });
  lbl.textContent = t;
  s.appendChild(lbl);
});

const xAt = i => PAD_L + (plotW * i) / (labels.length - 1);
const yAt = v => PAD_T + plotH * (1 - v/max);
const toPath = arr => arr.map((v, i) => `${i===0?'M':'L'}${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');

s.appendChild(el('path', { d: toPath(opened), stroke: '#8B93A0', 'stroke-width': 1.5, fill: 'none', 'stroke-dasharray': '4 3' }));
s.appendChild(el('path', { d: toPath(closed), stroke: '#0052FF', 'stroke-width': 1.8, fill: 'none' }));

closed.forEach((v, i) => {
  s.appendChild(el('circle', { cx: xAt(i), cy: yAt(v), r: 3, fill: '#0052FF' }));
});
opened.forEach((v, i) => {
  s.appendChild(el('circle', { cx: xAt(i), cy: yAt(v), r: 2.5, fill: '#fff', stroke: '#8B93A0', 'stroke-width': 1.2 }));
});

labels.forEach((l, i) => {
  const x = xAt(i);
  const t = el('text', { x, y: H - 10, 'text-anchor': 'middle', fill: '#646B78', 'font-family': 'Inter', 'font-size': 10 });
  t.textContent = l;
  s.appendChild(t);
});

document.getElementById('chart').appendChild(s);
</script>
</body>
</html>
