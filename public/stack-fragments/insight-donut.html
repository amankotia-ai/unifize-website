<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open NCs by stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/stack-fragments/styles.css" />
<style>body { padding: 24px; background: var(--n-25); }</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <h3 class="title">Open NCs by stage</h3>
    <span class="meta">27 total</span>
  </div>
  <div class="card-body" style="display: grid; grid-template-columns: 160px 1fr; gap: 22px; align-items: center;">
    <div id="donut" style="width: 160px; height: 160px;"></div>
    <div class="donut-legend" id="legend"></div>
  </div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const segments = [
  { label: 'Identification', value: 4, color: 'var(--u-primary)' },
  { label: 'Disposition', value: 6, color: '#5C8AFF' },
  { label: 'Root Cause', value: 8, color: '#A6BEFA' },
  { label: 'CAR open', value: 5, color: '#D6E0FF' },
  { label: 'Verify',      value: 4, color: 'var(--n-200)' },
];
const total = segments.reduce((a, b) => a + b.value, 0);
const s = document.createElementNS(NS, 'svg');
s.setAttribute('viewBox', '0 0 100 100');
s.setAttribute('width', '100%');
s.setAttribute('height', '100%');
let a = -Math.PI / 2;
const R = 38, r = 22, cx = 50, cy = 50;
segments.forEach(seg => {
  const ang = (seg.value / total) * Math.PI * 2;
  const a1 = a, a2 = a + ang;
  const large = ang > Math.PI ? 1 : 0;
  const p = document.createElementNS(NS, 'path');
  const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
  const x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
  const x3 = cx + r * Math.cos(a2), y3 = cy + r * Math.sin(a2);
  const x4 = cx + r * Math.cos(a1), y4 = cy + r * Math.sin(a1);
  p.setAttribute('d', `M${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${large} 0 ${x4},${y4} Z`);
  p.setAttribute('fill', seg.color);
  s.appendChild(p);
  a = a2;
});
const t = document.createElementNS(NS, 'text');
t.setAttribute('x', 50); t.setAttribute('y', 50);
t.setAttribute('text-anchor', 'middle');
t.setAttribute('dominant-baseline', 'central');
t.setAttribute('font-family', 'JetBrains Mono');
t.setAttribute('font-size', 11);
t.setAttribute('fill', '#2B2F38');
t.textContent = '27';
s.appendChild(t);
document.getElementById('donut').appendChild(s);

const lg = document.getElementById('legend');
segments.forEach(seg => {
  const row = document.createElement('div');
  row.className = 'donut-row';
  row.innerHTML = `<span class="sw" style="background:${seg.color}"></span><span class="k">${seg.label}</span><span class="v">${seg.value}</span>`;
  lg.appendChild(row);
});
</script>
</body>
</html>
